[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-associative-memory-hopfield-net"
version = "0.1.0"
description = "Modern Continuous Hopfield Network retriever providing fast associative memory pattern completion from partial prompt cues"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-associative-memory-hopfield-net = "agent_associative_memory_hopfield_net.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_associative_memory_hopfield_net*"]
